<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width={{WIDTH}}, height={{HEIGHT}}" />
    <script src="../vendor/gsap.min.js"></script>
    <style>
      :root { --ink: {{INK}}; --font-display: {{FONT}}; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: {{WIDTH}}px; height: {{HEIGHT}}px; overflow: hidden; background: #000; }
      #root { width: {{WIDTH}}px; height: {{HEIGHT}}px; position: relative; overflow: hidden; font-family: var(--font-display); }
      .plate { position: absolute; left: 0; top: 0; width: {{WIDTH}}px; height: {{HEIGHT}}px; object-fit: cover; }
      #plateB { clip-path: inset(0 100% 0 0); }
      #label { position: absolute; left: 0; right: 0; bottom: {{LABEL_BOTTOM}}px; text-align: center; color: var(--ink); font-size: {{LABEL_SIZE}}px; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0; text-shadow: 0 2px 16px rgba(0,0,0,0.5); }
    </style>
  </head>
  <body>
    <!-- Template: architectural-transition. Plate A (exterior or floor plan) is revealed by plate B (floor level or apartment) with a horizontal clip-path wipe. Both plates must share framing; the wipe is linear. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DURATION}}" data-width="{{WIDTH}}" data-height="{{HEIGHT}}">
      <video id="plateA" class="plate clip" data-start="0" data-duration="{{DURATION}}" data-track-index="0" src="{{PLATE_A_SRC}}" muted playsinline></video>
      <video id="plateB" class="plate clip" data-start="0" data-duration="{{DURATION}}" data-track-index="1" data-media-start="{{PLATE_B_START}}" src="{{PLATE_B_SRC}}" muted playsinline></video>
      <div id="label" class="clip" data-start="0" data-duration="{{DURATION}}" data-track-index="2">{{LABEL}}</div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.to("#plateB", { clipPath: "inset(0 0% 0 0)", duration: {{WIPE_DURATION}}, ease: "power2.inOut" }, {{WIPE_START}});
      tl.to("#label", { opacity: 1, duration: 0.8, ease: "power2.out" }, {{WIPE_START}} + {{WIPE_DURATION}} * 0.6);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
