<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width={{WIDTH}}, height={{HEIGHT}}" />
    <script src="../vendor/gsap.min.js"></script>
    <style>
      :root { --ink: {{INK}}; --font-display: {{FONT}}; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: {{WIDTH}}px; height: {{HEIGHT}}px; overflow: hidden; background: #000; }
      #root { width: {{WIDTH}}px; height: {{HEIGHT}}px; position: relative; overflow: hidden; font-family: var(--font-display); }
      #plate { position: absolute; left: -{{PAN_PX}}px; top: 0; width: calc(100% + {{PAN_PX}}px * 2); height: {{HEIGHT}}px; object-fit: cover; }
      #title { position: absolute; left: 0; right: 0; bottom: {{TITLE_BOTTOM}}px; text-align: center; color: var(--ink); font-size: {{TITLE_SIZE}}px; font-weight: 600; letter-spacing: -0.02em; text-shadow: 0 4px 24px rgba(0,0,0,0.45); opacity: 0; }
      #sub { position: absolute; left: 0; right: 0; bottom: {{SUB_BOTTOM}}px; text-align: center; color: var(--ink); font-size: {{SUB_SIZE}}px; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0; }
    </style>
  </head>
  <body>
    <!-- Template: facade-flyby. Lateral dolly: plate pans from +PAN_PX to -PAN_PX across the duration (deterministic GSAP). Use a plate with horizontal facade rhythm. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DURATION}}" data-width="{{WIDTH}}" data-height="{{HEIGHT}}">
      <video id="plate" class="clip" data-start="0" data-duration="{{DURATION}}" data-track-index="0" src="{{PLATE_SRC}}" muted playsinline></video>
      <h1 id="title" class="clip" data-start="0" data-duration="{{DURATION}}" data-track-index="1">{{TITLE}}</h1>
      <div id="sub" class="clip" data-start="0" data-duration="{{DURATION}}" data-track-index="2">{{SUBTITLE}}</div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#plate", { x: {{PAN_PX}} }, { x: -{{PAN_PX}}, duration: {{DURATION}}, ease: "none" }, 0);
      tl.to("#title", { opacity: 1, duration: 1.0, ease: "power2.out" }, 0.4);
      tl.to("#sub", { opacity: 1, duration: 0.9, ease: "power2.out" }, 1.0);
      tl.to(["#title", "#sub"], { opacity: 0, duration: 0.6, ease: "power2.in" }, {{DURATION}} - 0.9);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
