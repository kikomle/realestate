<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="../vendor/gsap.min.js"></script>
    <style>
      :root { --ink: #ffffff; --font-display: sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { width: 1080px; height: 1920px; position: relative; overflow: hidden; font-family: var(--font-display); }
      #plate { position: absolute; left: -120px; top: 0; width: calc(100% + 120px * 2); height: 1920px; object-fit: cover; }
      #title { position: absolute; left: 0; right: 0; bottom: 300px; text-align: center; color: var(--ink); font-size: 84px; font-weight: 600; letter-spacing: -0.02em; text-shadow: 0 4px 24px rgba(0,0,0,0.45); opacity: 0; }
      #sub { position: absolute; left: 0; right: 0; bottom: 230px; text-align: center; color: var(--ink); font-size: 30px; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0; }
    </style>
  </head>
  <body>
    <!-- Template: facade-flyby. Lateral dolly: plate pans from +PAN_PX to -PAN_PX across the duration (deterministic GSAP). Use a plate with horizontal facade rhythm. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1080" data-height="1920">
      <video id="plate" class="clip" data-start="0" data-duration="6" data-track-index="0" src="assets/placeholder/facade-placeholder-portrait.mp4" muted playsinline></video>
      <h1 id="title" class="clip" data-start="0" data-duration="6" data-track-index="1">FACADE</h1>
      <div id="sub" class="clip" data-start="0" data-duration="6" data-track-index="2">Placeholder</div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#plate", { x: 120 }, { x: -120, duration: 6, ease: "none" }, 0);
      tl.to("#title", { opacity: 1, duration: 1.0, ease: "power2.out" }, 0.4);
      tl.to("#sub", { opacity: 1, duration: 0.9, ease: "power2.out" }, 1.0);
      tl.to(["#title", "#sub"], { opacity: 0, duration: 0.6, ease: "power2.in" }, 6 - 0.9);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
