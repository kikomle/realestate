<!doctype html>
<html lang="hr" data-view="arrival" data-state="OVERVIEW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Močire Zadar H | Privatni pregled pročelja</title>
    <link rel="stylesheet" href="/assets/preview.css" />
    <script defer src="/assets/gsap.min.js"></script>
    <script type="module" src="/assets/preview.js"></script>
  </head>
  <body>
    <main class="shell" aria-label="Močire Zadar H — pregled zgrade">
      <header class="topbar">
        <a class="identity" href="/" id="overviewLink" aria-label="Močire Zadar H — početni pregled">
          <svg class="monogram" width="31" height="35" viewBox="0 0 31 35" aria-hidden="true" fill="none">
            <path d="M2 30V9l8-5v21M10 12l8-5v21M18 16l11-6v19l-9 5-8-4-10 1" stroke="currentColor" stroke-linecap="square" stroke-width="1.3" />
          </svg>
          <span class="wordmark">Močire</span>
          <span class="project-label">Zadar <span aria-hidden="true">/</span> Zgrada H</span>
        </a>

        <nav class="view-switch" aria-label="Pogled na zgradu">
          <a id="arrivalLink" data-image="arrival" href="/" aria-current="page">Prilaz</a>
          <a id="facadeLink" data-image="facade" href="/?view=facade">Pročelje</a>
        </nav>
        <p class="private-label">Privatni pregled</p>
      </header>

      <div class="scene" id="scene" data-ready="false" data-asset="loading">
        <section class="canvas" id="canvasContainer" aria-label="Arhitektonski prikaz zgrade H">
          <div class="frame" id="transformStage">
            <picture class="still arrival">
              <source type="image/avif" srcset="/assets/arrival-960.avif 960w, /assets/arrival-1280.avif 1280w, /assets/arrival-1920.avif 1920w" sizes="(max-width: 600px) 800px, 100vw" />
              <img id="imgArrival" src="/assets/arrival.webp" srcset="/assets/arrival-960.webp 960w, /assets/arrival-1280.webp 1280w, /assets/arrival.webp 1920w" sizes="(max-width: 600px) 800px, 100vw" width="1920" height="1080" fetchpriority="high" alt="Močire Zadar, zgrada H i uređeni prilaz" />
            </picture>
            <picture class="still facade">
              <source type="image/avif" data-srcset="/assets/facade-960.avif 960w, /assets/facade-1280.avif 1280w, /assets/facade-1920.avif 1920w" sizes="(max-width: 680px) and (orientation: portrait) 1280px, calc(100vw + 250px)" />
              <img id="imgFacade" data-src="/assets/facade.webp" data-srcset="/assets/facade-960.webp 960w, /assets/facade-1280.webp 1280w, /assets/facade.webp 1920w" sizes="(max-width: 680px) and (orientation: portrait) 1280px, calc(100vw + 250px)" width="1920" height="1080" alt="Zgrada H, pogled ravno na pročelje" aria-hidden="true" />
            </picture>
            <svg class="overlay" id="overlaySvg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" aria-label="Privremeno označene etaže" data-overlay-group="exterior-floors" hidden></svg>
          </div>
          <div class="plan-reveal" id="planReveal" aria-hidden="true" hidden></div>
          <div class="loading-message" id="imageMessage" role="status" hidden></div>
        </section>

        <div class="rail" id="floorPanel" data-available="false">
          <div class="rail-header">
            <h2 id="floorPickerTitle">Etaže</h2>
            <span>Pročelje</span>
          </div>
          <ol class="floor-list" id="floorListRail" aria-label="Popis etaža"></ol>
          <p class="rail-note">Položaji na pročelju nisu potvrđeni.</p>
        </div>

        <div class="scene-caption" aria-hidden="true"><span></span><span id="shotLabel">Pogled s prilaza</span></div>
        <div class="camera-tools" id="cameraTools" role="group" aria-label="Pomak i povećanje pročelja" hidden>
          <button type="button" id="btnZoomOut" aria-label="Smanji prikaz">−</button>
          <button type="button" id="btnResetView" aria-label="Vrati kadar pročelja" title="Vrati kadar pročelja">
            <svg width="17" height="17" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M2.5 7V2.5H7m6 0h4.5V7m0 6v4.5H13m-6 0H2.5V13M8 10h4m-2-2v4" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.4" /></svg>
          </button>
          <button type="button" id="btnZoomIn" aria-label="Povećaj prikaz">+</button>
        </div>
      </div>

      <footer class="project-panel">
        <div class="panel-index" aria-hidden="true"><span id="panelIndex">H</span><i></i></div>
        <div class="panel-heading">
          <p class="panel-kicker" id="panelKicker">Stambena zgrada u Zadru</p>
          <h1 id="panelTitle">Močire Zadar H</h1>
        </div>
        <p class="panel-copy" id="inspectorContent" aria-live="polite">Pogled s prilaza i pročelje zgrade H.</p>
        <a id="panelAction" class="panel-action" href="/?view=facade" aria-label="Istraži etaže zgrade H">
          <span>Istraži etaže</span>
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3.5 10h12m-4-4 4 4-4 4" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" /></svg>
        </a>
      </footer>
      <noscript><p class="no-script">Uključite JavaScript za pregled etaža. Početni prikaz zgrade dostupan je iznad.</p></noscript>
    </main>
  </body>
</html>
